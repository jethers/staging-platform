# Nome do serviço — usado em labels, nomes de recursos e seletores
name: my-service

# Namespace Kubernetes do serviço — obrigatório, deve vir do values.yaml do serviço.
# Sem default: a renderização falha se não for definido (evita provisionar no namespace errado).
namespace: ""

# Role do deployment — define o sufixo do nome do recurso:
#   staging    → <name>                      (compartilhado, permanente)
#   candidate  → <name>-candidate            (versão em homologação)
#   client     → <name>-<target>-client      (cliente de regressão)
#   dependency → <name>-<target>-dependency  (reservado para evolução futura; não usado no MVP)
role: staging
# Serviço candidato alvo — obrigatório para role client (e dependency, futuro)
# ex.: para checkout como client do wallet, target: wallet
target: ""

# Injeção do sidecar Istio — setada pelo orquestrador (ver decisão 11).
# No MVP: true apenas para clients (que originam o desvio para a candidata).
istioInject: false

image:
  # Repositório da imagem (ex.: gcr.io/my-project/my-service)
  repository: my-service
  # Tag da imagem. Ignorada quando digest está definido.
  tag: latest
  # Digest SHA-256 imutável. Quando definido, sobrescreve a tag.
  # ex.: sha256:abc123...
  digest: ""
  pullPolicy: IfNotPresent

# Número de réplicas desejadas
replicaCount: 1

service:
  # Porta exposta pelo Service do Kubernetes
  port: 8080
  # ClusterIP | NodePort | LoadBalancer
  type: ClusterIP

# Variáveis de ambiente injetadas no container
# Formato:
#   env:
#     - name: MY_VAR
#       value: "my-value"
env: []

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Labels extras aplicados em todos os recursos
extraLabels: {}

# Lista de clients de regressão desta candidata (preenchida pelo orquestrador no
# candidate/values.yaml a partir do clients.yaml). Cada item é o label 'app' do
# pod client que deve ser roteado para a candidata.
# O VirtualService só é renderizado quando role=candidate e esta lista é não-vazia.
# Formato:
#   clients:
#     - checkout-wallet-client
#     - payments-wallet-client
clients: []
