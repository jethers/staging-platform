apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ required "namespace é obrigatório no values.yaml do serviço" .Values.namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "service-chart.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
