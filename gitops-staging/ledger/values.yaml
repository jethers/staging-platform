# Base values — comuns a todos os ambientes do ledger
name: ledger
namespace: payments

image:
  repository: staging-platform/ledger
  pullPolicy: IfNotPresent

service:
  port: 8080
  type: ClusterIP

env:
  - name: PORT
    value: "8080"

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
