# Values de produção do checkout
name: checkout
namespace: payments

image:
  repository: staging-platform/checkout
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  type: ClusterIP

env:
  - name: PORT
    value: "8080"
  - name: WALLET_URL
    value: "http://wallet:8080"

resources:
  requests:
    cpu: "200m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
