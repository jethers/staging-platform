# Application — runtime compartilhado (staging) do wallet
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jethers/staging-platform.git
    targetRevision: main
    path: helm/service-chart
    helm:
      # namespace é obrigatório no chart; os demais vêm dos value files do gitops
      parameters:
        - name: namespace
          value: payments
      valueFiles:
        - ../../gitops-staging/wallet/values.yaml
        - ../../gitops-staging/wallet/staging/values.yaml
        - ../../gitops-staging/wallet/staging/release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
