# Application — candidata do wallet (efêmera: criada quando o orquestrador roda)
#
# Aplique APÓS o orquestrador provisionar gitops-staging/wallet/candidate/.
# Renderiza Service + Deployment + VirtualService (o roteamento client → candidata).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-candidate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jethers/staging-platform.git
    targetRevision: main
    path: helm/service-chart
    helm:
      parameters:
        - name: namespace
          value: payments
      valueFiles:
        - ../../gitops-staging/wallet/values.yaml
        - ../../gitops-staging/wallet/candidate/values.yaml
        - ../../gitops-staging/wallet/candidate/release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
